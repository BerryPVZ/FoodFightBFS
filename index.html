function splitLabel(text){ const words=text.split(' '); if(words.length<3) return [text]; const mid=Math.ceil(words.length/2); return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')]; }

function inRect(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
function screenPoint(ev){ const r=canvas.getBoundingClientRect(); const t=ev.touches?ev.touches[0]:ev; return {x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height}; }
canvas.addEventListener('pointerdown', ev=>{ ev.preventDefault(); unlockAudio(); const p=screenPoint(ev); handleClick(p); });
canvas.addEventListener('pointermove', ev=>{ hovered=screenPoint(ev); });

function drawText(text,x,y,size=20,color='#fff',align='left',stroke=true){
 ctx.save(); ctx.font=`bold ${size}px Trebuchet MS, Comic Sans MS, sans-serif`; ctx.textAlign=align; ctx.textBaseline='top';
 if(stroke){ ctx.lineWidth=Math.max(3,size/7); ctx.strokeStyle='rgba(36,22,12,.85)'; ctx.strokeText(text,x,y); }
 ctx.fillStyle=color; ctx.fillText(text,x,y); ctx.restore();
}
function drawPanel(x,y,w,h,fill='#8e3b2d',edge='#481b1a'){
 ctx.save(); ctx.fillStyle=edge; roundRect(x-5,y-5,w+10,h+10,14); ctx.fill(); ctx.fillStyle=fill; roundRect(x,y,w,h,12); ctx.fill(); ctx.strokeStyle='rgba(255,230,160,.25)'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawButton(b){
 const hot=hovered&&inRect(hovered,b); ctx.save();
 ctx.fillStyle=b.opts.small?'#c5792b': hot?'#d2853b':'#a95534'; roundRect(b.x,b.y,b.w,b.h,12); ctx.fill();
 ctx.strokeStyle=hot?'#ffe783':'#5f1d18'; ctx.lineWidth=4; ctx.stroke();
 drawText(b.label,b.x+b.w/2,b.y+b.h/2-(b.opts.size||24)/2,b.opts.size||24,'#fff2cf','center'); ctx.restore();
}
function bgCafeteria(theme=campaignDefs[0]){
 const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,theme.wall||'#0e2e38'); g.addColorStop(.44,theme.wall||'#102d35'); g.addColorStop(.45,theme.floor1||'#eee8ce'); g.addColorStop(1,theme.floor2||'#d8ceb0'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(0,236,W,8);
 // tile floor
 for(let y=250;y<H;y+=58){ ctx.strokeStyle='rgba(100,80,55,.15)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
 for(let x=0;x<W;x+=92){ ctx.strokeStyle='rgba(100,80,55,.13)'; ctx.beginPath(); ctx.moveTo(x,245); ctx.lineTo(x+90,H); ctx.stroke(); }
}

function startLevel(level){
 const camp=currentCampaignDef();
 chosenIds = chosenIds.filter(id=>{ const w=byId(id); return w && w.unlock<=level && (!w.campaign || w.campaign===camp.id); }).slice(0,6);
 if(!chosenIds.length) chosenIds=['mint','jello',camp.food].filter(id=>byId(id));
 const chosen=chosenIds.map(byId).filter(Boolean);
 game={
  level, campaign:selectedCampaign, campaignName:camp.name, chosen, money: level===1?175:155+level*30, plants:[], enemies:[], projectiles:[], coins:[], particles:[], selected:null, shovel:false,
  cooldowns:{}, sweepers:[true,true,true,true,true], ready:3.2, win:false, lose:false, spawnTimer:0, spawned:0, wave:buildWave(level, selectedCampaign), message:'READY', shake:0, killed:0, dark:0
 };
 weaponDefs.forEach(w=>game.cooldowns[w.id]=0);
 setState('play');
}
function buildWave(level,campaignIndex=0){
 const camp=campaignDefs[campaignIndex] || campaignDefs[0];
 const pool=['geek']; if(level>=2) pool.push('cheer','baller'); if(level>=3) pool.push('jock'); if(level>=5) pool.push('zombie'); if(level>=6) pool.push('bomb'); if(level>=8) pool.push('rusher'); if(level>=9) pool.push('football');
 if(camp.enemy && enemyDefs[camp.enemy]){ pool.push(camp.enemy); if(level>=4) pool.push(camp.enemy); }
 (camp.bonus||[]).forEach(t=>{ if(enemyDefs[t] && !pool.includes(t)) pool.push(t); pool.push(t); });
 const wave=[]; const count=Math.round(5+level*2.25+campaignIndex*.18); let t=0;
 // Slower, more readable waves: larger gaps between humans, especially in early levels.
 const minGap=Math.max(3.25,5.45-level*.055-campaignIndex*.004);
 const maxGap=Math.max(4.8,8.35-level*.045-campaignIndex*.004);
 for(let i=0;i<count;i++){ t += rnd(minGap,maxGap); let type=pool[Math.floor(Math.random()*pool.length)]; if(i%10===8 && camp.enemy) type=camp.enemy; if(i%14===11 && level>=6) type=(camp.enemy||'bomb'); wave.push({time:t,type}); }
 for(let i=0;i<Math.min(level,5);i++) wave.push({time:t+11+i*3.0,type:pool[Math.floor(Math.random()*pool.length)]});
 return wave.sort((a,b)=>a.time-b.time);
}
function spawnEnemy(type){
 const d=enemyDefs[type] || enemyDefs.geek; const camp=campaignDefs[game.campaign] || campaignDefs[0]; const row=Math.floor(Math.random()*grid.rows); const scale=1+game.level*.028+game.campaign*.01;
 let speed=d.speed*(1+game.level*.012); if(camp.id==='freezer' && d.behavior!=='freezeResist') speed*=.88;
 game.enemies.push({type,row,x:W+40,y:rowY(row)+10,hp:d.hp*scale,maxHp:d.hp*scale,speed,atk:d.atk*scale,cool:0,stun:0,slow:0,freeze:0,jumped:false,bleed:0,burn:0,boost:0,frame:Math.random()*10});
}
function addParticle(x,y,text,color='#fff'){ game.particles.push({x,y,text,color,life:1,vy:-35}); }
function dropMoney(x,y,amount){ game.coins.push({x,y,amount,life:8,vy:0,spin:0}); }
function plantAt(row,col){ return game.plants.find(p=>p.row===row&&p.col===col); }
function addPlant(w,row,col){ const camp=campaignDefs[game.campaign] || campaignDefs[0]; let hp=w.hp; if(camp.id==='thanksgiving' && w.role==='wall') hp*=1.2; game.plants.push({id:w.id,row,col,hp,maxHp:hp,last:0,money:0,anim:0}); game.money-=w.cost; game.cooldowns[w.id]=w.cool; sfx('sfx_plant.mp3',.7); }
function gameClick(p){
 if(game.win||game.lose){ if(p.x>360&&p.x<600&&p.y>300&&p.y<355){ setState('levels'); playMusic('menu'); } return; }
 if(p.x>800 && p.y<66){ setState('menu'); playMusic('menu'); return; }
 // collect coins first
 for(let i=game.coins.length-1;i>=0;i--){ const c=game.coins[i]; if(Math.hypot(p.x-c.x,p.y-c.y)<34){ game.money+=c.amount; addParticle(c.x,c.y,'+$'+c.amount,'#fff06a'); game.coins.splice(i,1); sfx('sfx_coin.mp3',.9); return; } }
 // seedbank
 for(let i=0;i<game.chosen.length;i++){ const y=74+i*72; if(p.x>=7&&p.x<=88&&p.y>=y&&p.y<=y+62){ const w=game.chosen[i]; if(game.cooldowns[w.id]<=0 && game.money>=w.cost){ game.selected=w.id; game.shovel=false; } else { addParticle(100,y+30, game.money<w.cost?'Need money':'Cooling','#ffdf74'); } return; } }
 // shovel
 if(p.x>=10&&p.x<=86&&p.y>=496&&p.y<=534){ game.shovel=!game.shovel; game.selected=null; sfx('sfx_click.mp3'); return; }
 // board
 const col=Math.floor((p.x-grid.x)/grid.cw), row=Math.floor((p.y-grid.y)/grid.ch);
 if(row>=0&&row<grid.rows&&col>=0&&col<grid.cols){
   const existing=plantAt(row,col);
   if(game.shovel){ if(existing){ game.plants=game.plants.filter(pl=>pl!==existing); addParticle(colX(col),rowY(row),'removed','#ffffff'); sfx('sfx_click.mp3'); } return; }
   if(game.selected && !existing){ const w=byId(game.selected); if(w && game.money>=w.cost && game.cooldowns[w.id]<=0) addPlant(w,row,col); return; }
 }
}

function update(dt){
 if(state!=='play' || !game) return;
 dt=clamp(dt,0,.05); if(game.shake>0) game.shake-=dt;
 Object.keys(game.cooldowns).forEach(k=>{ if(game.cooldowns[k]>0) game.cooldowns[k]-=dt; });
 game.particles.forEach(p=>{p.life-=dt; p.y+=p.vy*dt;}); game.particles=game.particles.filter(p=>p.life>0);
 game.coins.forEach(c=>{ c.life-=dt; c.spin+=dt*4; c.y+=Math.sin(c.spin)*.08; }); game.coins=game.coins.filter(c=>c.life>0);
 if(game.win||game.lose) return;
 const camp=campaignDefs[game.campaign] || campaignDefs[0]; if(game.dark>0) game.dark-=dt;
 if(game.ready>0){ game.ready-=dt; if(game.ready>2.15) game.message='READY'; else if(game.ready>1.05) game.message='SET'; else game.message='PREPARE!'; return; }
 game.spawnTimer+=dt;
 while(game.spawned<game.wave.length && game.spawnTimer>=game.wave[game.spawned].time){ spawnEnemy(game.wave[game.spawned].type); game.spawned++; }
 // plants
 for(const p of game.plants){ p.anim+=dt; const w=byId(p.id); if(!w) continue; const px=colX(p.col), py=rowY(p.row);
   if(w.role==='money'){ const mintEvery=camp.id==='breakfast'?3.25:4.25; const mintVal=25+(camp.id==='cafeteria'?5:0); p.money+=dt; if(p.money>=mintEvery){ p.money=0; dropMoney(px+rnd(-12,12),py-38,mintVal); } continue; }
   if(w.role==='healer'){ p.last-=dt; if(p.last<=0){ const allies=game.plants.filter(a=>a!==p && Math.abs(a.row-p.row)<=1 && a.hp<a.maxHp); if(allies.length){ allies.sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp)); allies[0].hp=Math.min(allies[0].maxHp,allies[0].hp+(w.heal||20)); addParticle(colX(allies[0].col),rowY(allies[0].row)-35,'+heal','#d8f9ff'); } p.last=w.rate||1.5; } continue; }
   if(w.role==='trap' || w.role==='bomb'){
     const e=game.enemies.find(e=>e.row===p.row && Math.abs(e.x-px)<35);
     if(e){ damageEnemy(e,w.dmg||120,w.effect,px,py); if(w.role==='bomb'){ splash(px,py,w.dmg||200,95); } game.plants=game.plants.filter(pl=>pl!==p); addParticle(px,py,w.role==='bomb'?'NOVA!':'CHOMP!','#fff27a'); game.shake=.16; }
     continue;
   }
   if(w.role==='spike'){
     p.last-=dt; if(p.last<=0){ const e=game.enemies.find(e=>e.row===p.row && Math.abs(e.x-px)<38); if(e){ damageEnemy(e,w.dmg,w.effect,px,py); p.last=w.rate; } }
     continue;
   }
   if(w.regen && p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+w.regen*dt);
   if(w.role==='wall') continue;
   p.last-=dt;
   const target=game.enemies.filter(e=>Math.abs(e.row-p.row)<=0 && e.x>px-10).sort((a,b)=>a.x-b.x)[0];
   if(target && p.last<=0){
     const rowOffsets=w.spreadRows?[-1,0,1]:[0]; for(const ro of rowOffsets){ const prow=p.row+ro; if(prow<0||prow>=grid.rows) continue; const shots=w.multi||1; for(let s=0;s<shots;s++){ game.projectiles.push({x:px+28,y:py-18+(s-(shots-1)/2)*10+ro*6,row:prow,dmg:w.dmg,speed:w.speed||300,effect:w.effect,shot:w.shot||'jello_blob.png',splash:w.splash||0,pierce:w.pierce||1,lob:!!w.lob,age:0,rowSplash:w.rowSplash}); } }
     p.last=w.rate||1.5; sfx('sfx_shoot.mp3',.35);
   }
 }
 // projectiles
 for(const pr of game.projectiles){ pr.age+=dt; pr.x += pr.speed*dt; if(pr.lob) pr.y += Math.sin(pr.age*8)*10*dt; const hit=game.enemies.filter(e=>Math.abs(e.row-pr.row)<=0 && Math.abs(e.x-pr.x)<28).sort((a,b)=>a.x-b.x)[0]; if(hit){ damageEnemy(hit,pr.dmg,pr.effect,pr.x,pr.y); if(pr.splash) splash(pr.x,pr.y,pr.dmg*.65,pr.splash); if(pr.rowSplash){ for(const e of game.enemies){ if(Math.abs(e.row-pr.row)<=1 && Math.abs(e.x-pr.x)<55) damageEnemy(e,pr.dmg*.45,pr.effect,pr.x,pr.y); } }
       pr.pierce--; if(pr.pierce<=0 || pr.splash) pr.dead=true; }
   if(pr.x>W+50) pr.dead=true;
 }
 game.projectiles=game.projectiles.filter(p=>!p.dead);
 // enemies
 for(const e of game.enemies){ const d=enemyDefs[e.type] || enemyDefs.geek; e.frame+=dt;
   if(d.behavior==='dim' && !e.dimmed && e.x<760){ e.dimmed=true; game.dark=Math.max(game.dark,2.4); addParticle(e.x,rowY(e.row)-45,'lights out!','#e8dcff'); }
   if(d.behavior==='buff'){ for(const other of game.enemies){ if(other!==e && other.row===e.row && Math.abs(other.x-e.x)<135) other.boost=Math.max(other.boost||0,.7); } }
   if(d.behavior==='laneSwap' && !e.swapped && e.x<760 && e.x>430){ const dir=Math.random()<.5?-1:1; const nr=clamp(e.row+dir,0,grid.rows-1); if(nr!==e.row){ e.row=nr; e.swapped=true; addParticle(e.x,rowY(e.row)-30,'sidestep!','#fff27a'); } }
   if(d.behavior==='steal'){ for(let i=game.coins.length-1;i>=0;i--){ const c=game.coins[i]; if(Math.hypot(e.x-c.x,rowY(e.row)-c.y)<42){ game.coins.splice(i,1); e.hp=Math.min(e.maxHp,e.hp+35); addParticle(e.x,rowY(e.row)-45,'stole $','#ffd76c'); break; } } }
   if(e.stun>0){e.stun-=dt; continue;} if(e.freeze>0){e.freeze-=dt; continue;} if(e.bleed>0){ e.bleed-=dt; e.hp-=8*dt; } if(e.burn>0){ e.burn-=dt; e.hp-=11*dt; }
   const slowMult = e.slow>0 ? .45 : 1; if(e.slow>0) e.slow-=dt; const boostMult=e.boost>0?1.18:1; if(e.boost>0) e.boost-=dt;
   const chillMult = camp.id==='freezer' && d.behavior!=='freezeResist' ? .88 : 1;
   const col=Math.floor((e.x-grid.x)/grid.cw); const blocker=game.plants.filter(p=>p.row===e.row && Math.abs(colX(p.col)-e.x)<35).sort((a,b)=>b.col-a.col)[0];
   if(blocker){ const wd=byId(blocker.id);
     if(d.behavior==='cleaner' && wd && (wd.role==='trap'||wd.role==='spike')){ blocker.hp=0; e.cool=.35; addParticle(colX(blocker.col),rowY(blocker.row)-30,'swept!','#e8f2ff'); }
     else if(d.behavior==='jump' && !e.jumped && wd && wd.role!=='spike'){ e.x -= grid.cw*.95; e.jumped=true; addParticle(e.x,rowY(e.row)-30,'cartwheel!','#fff27a'); continue; }
     else { e.cool-=dt;
       if(e.cool<=0){ let damage=e.atk*(d.behavior==='trample'?1.28:1); if(d.behavior==='critic' && !e.reviewed){ damage+=45; e.reviewed=true; addParticle(colX(blocker.col),rowY(blocker.row)-46,'bad review!','#ffe0ff'); } blocker.hp-=damage; e.cool=.95; addParticle(colX(blocker.col),rowY(blocker.row)-28,'munch','#ffe0c0'); sfx('sfx_hit.mp3',.2); if(wd && wd.thorns) e.hp-=wd.thorns; if(d.behavior==='explode'){ blocker.hp-=130; splash(e.x,rowY(e.row),60,64); e.hp=0; game.shake=.2; } }
     }
     if(blocker.hp<=0) game.plants=game.plants.filter(p=>p!==blocker);
   } else { e.x -= e.speed*slowMult*boostMult*chillMult*dt; }
   if(e.x<grid.x-45){ if(game.sweepers[e.row]){ game.sweepers[e.row]=false; game.enemies=game.enemies.filter(other=>other.row!==e.row); addParticle(grid.x+90,rowY(e.row),'SWEEPER!','#e8f2ff'); sfx('sfx_sweeper.mp3',.9); game.shake=.25; break; } else { game.lose=true; sfx('sfx_lose.mp3'); playMusic('menu'); } }
 }
 game.enemies=game.enemies.filter(e=>!e.dead && e.hp>0);
 if(game.spawned>=game.wave.length && game.enemies.length===0){ game.win=true; campaignProgress[game.campaign]=Math.max(progressForCampaign(game.campaign), Math.min(10, game.level+1)); saveCampaignProgress(); sfx('sfx_win.mp3'); playMusic('menu'); }
}
function damageEnemy(e, dmg, effect, x, y){
 if(e.dead) return; const d=enemyDefs[e.type] || enemyDefs.geek; const camp=campaignDefs[game.campaign] || campaignDefs[0];
 if(d.behavior==='armor') dmg*=.72;
 if(d.behavior==='freezeResist' && effect==='freeze'){ effect='slow'; dmg*=.9; }
 if(d.behavior==='sugarRush' && !e.rushed){ e.rushed=true; e.speed*=1.32; addParticle(e.x,rowY(e.row)-44,'sugar rush!','#ff94ed'); }
 e.hp-=dmg;
 if(effect==='slow') e.slow=Math.max(e.slow,camp.id==='candy'?4.4:3.4); if(effect==='slow2') e.slow=Math.max(e.slow,camp.id==='candy'?6.4:5.0); if(effect==='stun') e.stun=Math.max(e.stun,.55); if(effect==='freeze') e.freeze=Math.max(e.freeze,camp.id==='freezer'?2.25:1.7); if(effect==='knock'){ e.x+=30; e.stun=Math.max(e.stun,.25); } if(effect==='slip'){ e.stun=Math.max(e.stun,2.2); e.slow=Math.max(e.slow,4); } if(effect==='bleed') e.bleed=Math.max(e.bleed,4); if(effect==='burn') e.burn=Math.max(e.burn,3.2); if(effect==='freshMoney' && Math.random()<.28) dropMoney(x,y,3);
 if(e.hp<=0){ e.dead=true; if(d.behavior==='split' && !e.splitDone){ e.splitDone=true; for(const off of [-1,1]){ const nr=clamp(e.row+off,0,grid.rows-1); game.enemies.push({type:'geek',row:nr,x:e.x+off*12,y:rowY(nr)+10,hp:46,maxHp:46,speed:46,atk:13,cool:0,stun:0,slow:0,freeze:0,jumped:false,bleed:0,burn:0,boost:0,frame:Math.random()*10}); } addParticle(e.x,rowY(e.row)-55,'split!','#fff27a'); }
   addParticle(e.x,rowY(e.row)-40,'yum!','#eaff8f'); let worth=d.worth||6; dropMoney(e.x,rowY(e.row)-20,worth); if(camp.id==='restaurant' && game.killed%5===4) dropMoney(e.x+18,rowY(e.row)-28,15); game.killed++; }
} 
function splash(x,y,dmg,rad){ for(const e of game.enemies){ if(!e.dead && Math.hypot(e.x-x,rowY(e.row)-y)<rad) damageEnemy(e,dmg,null,x,y); } }

function drawGame(){
 ctx.save(); if(game.shake>0) ctx.translate(rnd(-5,5),rnd(-5,5));
 // play bg
 const camp=campaignDefs[game.campaign] || campaignDefs[0];
 ctx.fillStyle=camp.floor1||'#efe7cf'; ctx.fillRect(0,0,W,H);
 ctx.fillStyle=camp.wall||'#0d733d'; ctx.fillRect(0,0,W,66);
 ctx.fillStyle=camp.trim||'#743019'; ctx.fillRect(0,0,W,22);
 ctx.fillStyle='#e6bb55'; ctx.fillRect(455,4,300,18); ctx.fillStyle='#964f2d'; ctx.fillRect(475,8,260,10); ctx.fillStyle='#f6df80'; ctx.fillRect(482,8,(game.spawned/game.wave.length)*246,10);
 drawText('$'+Math.floor(game.money),155,26,26,'#fff471'); drawText(camp.short+' '+game.level,360,27,16,'#fff4ce','center'); drawText('MENU',865,22,26,'#fff4ce','center');
 ctx.drawImage(img['lunch_money.png'],110,19,42,42);
 // seedbank
 ctx.fillStyle='#122d36'; ctx.fillRect(0,66,96,H-66); ctx.strokeStyle='#4c1d1b'; ctx.lineWidth=5; ctx.strokeRect(0,66,96,H-66);
 for(let i=0;i<game.chosen.length;i++){ const w=game.chosen[i], y=74+i*72, cool=clamp(game.cooldowns[w.id]/w.cool,0,1); ctx.fillStyle=game.selected===w.id?'#d6f08b':'#e6e2d0'; roundRect(8,y,80,62,8); ctx.fill(); ctx.strokeStyle='#2d4451'; ctx.lineWidth=3; ctx.stroke(); ctx.drawImage(img[w.img],12,y+3,50,50); drawText(String(w.cost),61,y+34,13,'#172a25','center',false); if(cool>0||game.money<w.cost){ ctx.fillStyle='rgba(0,0,0,.55)'; roundRect(8,y,80,62*cool,8); ctx.fill(); } }
 ctx.fillStyle=game.shovel?'#f3df78':'#e6e2d0'; roundRect(10,496,76,38,7); ctx.fill(); ctx.strokeStyle='#2d4451'; ctx.stroke(); ctx.drawImage(img['shovel.png'],12,492,42,42); drawText('DIG',54,505,14,'#3a211a','left',false);
 // board tile grid
 for(let r=0;r<grid.rows;r++){ for(let c=0;c<grid.cols;c++){ ctx.fillStyle=((r+c)%2?(camp.floor2||'#eee5ca'):(camp.floor1||'#f9f0d7')); ctx.fillRect(grid.x+c*grid.cw,grid.y+r*grid.ch,grid.cw,grid.ch); ctx.strokeStyle='rgba(130,105,74,.22)'; ctx.strokeRect(grid.x+c*grid.cw,grid.y+r*grid.ch,grid.cw,grid.ch); } }
 // sweepers
 for(let r=0;r<grid.rows;r++){ if(game.sweepers[r]) ctx.drawImage(img['sweeper.png'],8,rowY(r)-28,70,70); }
 // hover cell
 if(hovered){ const c=Math.floor((hovered.x-grid.x)/grid.cw), r=Math.floor((hovered.y-grid.y)/grid.ch); if(r>=0&&r<grid.rows&&c>=0&&c<grid.cols){ ctx.fillStyle='rgba(70,220,80,.18)'; ctx.fillRect(grid.x+c*grid.cw,grid.y+r*grid.ch,grid.cw,grid.ch); } }
 // plants sorted by row col
 game.plants.slice().sort((a,b)=>a.row-b.row || a.col-b.col).forEach(p=>{ const w=byId(p.id), x=colX(p.col), y=rowY(p.row); ctx.globalAlpha=1; ctx.drawImage(img[w.img],x-39,y-52,78,78); if(p.hp<p.maxHp){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(x-28,y+27,56,6); ctx.fillStyle='#49d747'; ctx.fillRect(x-28,y+27,56*clamp(p.hp/p.maxHp,0,1),6); } });
 // projectiles
 for(const pr of game.projectiles){ const bob=pr.lob?Math.sin(pr.age*8)*8:0; ctx.save(); if(pr.shot==='pizza_slice.png') { ctx.translate(pr.x,pr.y+bob); ctx.rotate(pr.age*8); ctx.drawImage(img[pr.shot],-18,-18,36,36); } else ctx.drawImage(img[pr.shot],pr.x-16,pr.y-16+bob,32,32); ctx.restore(); }
 // enemies
 game.enemies.slice().sort((a,b)=>a.row-b.row || a.x-b.x).forEach(e=>{ const d=enemyDefs[e.type], y=rowY(e.row)+6+Math.sin(e.frame*7)*2; ctx.drawImage(img[d.img],e.x-43,y-67,86,86); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(e.x-32,y+23,64,6); ctx.fillStyle=e.freeze>0?'#a8edff':e.slow>0?'#ff7bdc':'#ff4a38'; ctx.fillRect(e.x-32,y+23,64*clamp(e.hp/e.maxHp,0,1),6); });
 // money drops
 for(const c of game.coins){ ctx.drawImage(img['lunch_money.png'],c.x-20,c.y-20,40,40); }
 // particles
 for(const p of game.particles){ ctx.globalAlpha=clamp(p.life,0,1); drawText(p.text,p.x,p.y,17,p.color,'center'); ctx.globalAlpha=1; }
 if(game.dark>0){ ctx.fillStyle='rgba(0,0,0,'+(0.18+Math.min(.28,game.dark*.08))+')'; ctx.fillRect(grid.x,grid.y,grid.cw*grid.cols,grid.ch*grid.rows); }
 if(game.ready>0){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(0,0,W,H); drawText(game.message,W/2,H/2-35,62,'#fff7c8','center'); }
 if(game.win||game.lose){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H); drawPanel(298,176,364,186, game.win?'#386c32':'#783229'); drawText(game.win?'LUNCH SAVED!':'CAFETERIA OVERRUN',480,206,32,'#fff4c8','center'); drawText(game.win?`${camp.short} level ${game.level} complete. Enemies sauced: ${game.killed}`:'The hungry humans got through.',480,258,18,'#fff0c8','center'); drawButton({label:'LEVEL SELECT',x:360,y:305,w:240,h:50,fn:()=>{},opts:{size:22}}); }
 ctx.restore();
}

function loading(){
 bgCafeteria(); ctx.drawImage(img['title_foodfight.png'],90,65,330,150); drawText('Loading...',640,415,28,'#1c1610','center'); loadingSpin+=.08; ctx.save(); ctx.translate(640,330); ctx.rotate(loadingSpin); ctx.drawImage(img['spinner.png'],-36,-36,72,72); ctx.restore();
 if(loaded>=assetNames.length && state==='loading' && !game){ setTimeout(()=>{ if(state==='loading'&&!game) setState('menu'); }, 250); }
}
function loop(now){ const dt=(now-last)/1000; last=now; ctx.clearRect(0,0,W,H); update(dt);
 if(state==='loading') loading(); else if(state==='menu') menu(); else if(state==='campaigns') campaigns(); else if(state==='levels') levels(); else if(state==='weapons') weaponSelect(); else if(state==='fooddex') fooddex(); else if(state==='enemydex') enemydex(); else if(state==='help') help(); else if(state==='options') options(); else if(state==='play') drawGame();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
