function foodStats(w){
 if(!w) return null; const s=Object.assign({},w);
 const lvl=upgradeLevel(s.id); if(lvl>0){ if(s.hp) s.hp*=1+lvl*.16; if(s.dmg) s.dmg*=1+lvl*.18; if(s.heal) s.heal*=1+lvl*.18; if(s.cool) s.cool*=Math.pow(.91,lvl); if(s.rate) s.rate*=Math.pow(.90,lvl); }
 if(game){
   if(comboActive('ketchup_fries') && (s.id==='ketchup'||s.id==='fries')){ if(s.rate) s.rate*=.78; if(s.dmg) s.dmg*=1.12; }
   if(comboActive('gravy_turkey') && (s.id==='gravy'||s.id==='turkey')){ if(s.splash) s.splash*=1.35; if(s.dmg) s.dmg*=1.10; }

function colorMix(hex,amt){
 const n=parseInt(String(hex).replace('#',''),16); if(!Number.isFinite(n)) return hex;
 let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 if(amt>=0){ r+=Math.round((255-r)*amt); g+=Math.round((255-g)*amt); b+=Math.round((255-b)*amt); }
 else { r=Math.round(r*(1+amt)); g=Math.round(g*(1+amt)); b=Math.round(b*(1+amt)); }
 return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
function lighten(hex,amt){ return colorMix(hex,amt); }
function darken(hex,amt){ return colorMix(hex,-Math.abs(amt)); }

  level, campaign:campaignIndex, campaignName:camp.name, chosen, money: mini ? (mini.money||0) : (level===1?175:155+level*30), plants:[], enemies:[], projectiles:[], coins:[], particles:[], selected:null, shovel:false,

 };

function buildWave(level,campaignIndex=0,mini=null){
 const camp=campaignDefs[campaignIndex] || campaignDefs[0];
 const pool=(mini && mini.enemies) ? mini.enemies.slice() : ['geek']; if(level>=2) pool.push('cheer','baller','traykid'); if(level>=3) pool.push('sneaker'); if(level>=4) pool.push('jock','backpacker'); if(level>=5) pool.push('phonekid','zombie'); if(level>=6) pool.push('bomb'); if(level>=7) pool.push('coach'); if(level>=8) pool.push('rusher'); if(level>=9) pool.push('football');
 if(camp.enemy && enemyDefs[camp.enemy]){ pool.push(camp.enemy); if(level>=4) pool.push(camp.enemy); }
 (camp.bonus||[]).forEach(t=>{ if(enemyDefs[t] && !pool.includes(t)) pool.push(t); pool.push(t); });
 const wave=[]; const count=mini ? (mini.count||Math.round(5+level*1.35)) : Math.round(3+level*1.55+Math.min(campaignIndex,9)*.05); let t=0;
 // Even slower, more readable waves across every campaign and page.
 const minGap=mini ? (mini.minGap||5.2) : Math.max(5.0,7.1-level*.035);
 const maxGap=mini ? (mini.maxGap||8.0) : Math.max(7.2,10.8-level*.03);
 for(let i=0;i<count;i++){ t += rnd(minGap,maxGap); let type=pool[Math.floor(Math.random()*pool.length)]; if(i%10===8 && camp.enemy) type=camp.enemy; if(i%14===11 && level>=6) type=(camp.enemy||'bomb'); wave.push({time:t,type}); }
 for(let i=0;i<Math.min(level,4);i++) wave.push({time:t+17+i*4.4,type:pool[Math.floor(Math.random()*pool.length)]});
 return wave.sort((a,b)=>a.time-b.time);
}

 let speed=d.speed*(1+game.level*.012); if(camp.id==='freezer' && d.behavior!=='freezeResist') speed*=.88; if(camp.id==='bomb_bonanza' && type==='bomb') speed*=.82; if(camp.id==='banana_bloom' && (type==='rusher'||type==='sneaker')) speed*=.92;

}

 // shovel

 const col=Math.floor((p.x-grid.x)/grid.cw), row=Math.floor((p.y-grid.y)/grid.ch);

 }

function update(dt){
 if(state!=='play' || !game) return;
 dt=clamp(dt,0,.05); if(game.shake>0) game.shake-=dt;
 Object.keys(game.cooldowns).forEach(k=>{ if(game.cooldowns[k]>0) game.cooldowns[k]-=dt; });
 game.particles.forEach(p=>{p.life-=dt; p.x+=(p.vx||0)*dt; p.y+=p.vy*dt;}); game.particles=game.particles.filter(p=>p.life>0);
 game.coins.forEach(c=>{ c.life-=dt; c.spin+=dt*4; c.y+=Math.sin(c.spin)*.08; }); game.coins=game.coins.filter(c=>c.life>0);
 if(game.win||game.lose) return;
 const camp=campaignDefs[game.campaign] || campaignDefs[0]; if(game.dark>0) game.dark-=dt;
 if(game.ready>0){ game.ready-=dt; if(game.ready>2.15) game.message='READY'; else if(game.ready>1.05) game.message='SET'; else game.message='PREPARE!'; return; }
 if(game.minigame==='conveyor'){ game.conveyorTimer+=dt; const cardId=(chosenIds[0]||'jello'); if(game.conveyor.length<6 && game.conveyorTimer>=game.conveyorEvery){ game.conveyorTimer=0; game.conveyor.push(byId(cardId)||byId('jello')); addParticle(56,86+game.conveyor.length*64,'new jello','#fff27a'); } }
 game.spawnTimer+=dt;
 while(game.spawned<game.wave.length && game.spawnTimer>=game.wave[game.spawned].time){ spawnEnemy(game.wave[game.spawned].type); game.spawned++; }
 // plants
 for(const p of game.plants){ p.anim+=dt; const w=foodStats(byId(p.id)); if(!w) continue; const px=colX(p.col), py=rowY(p.row);
   if(w.role==='money'){ const mintEvery=camp.id==='breakfast'?4.15:5.0; const mintVal=50; p.money+=dt; if(p.money>=mintEvery){ p.money=0; dropMoney(px+rnd(-12,12),py-38,mintVal); } continue; }
   if(w.role==='healer'){ p.last-=dt; if(p.last<=0){ const allies=game.plants.filter(a=>a!==p && Math.abs(a.row-p.row)<=1 && a.hp<a.maxHp); if(allies.length){ allies.sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp)); allies[0].hp=Math.min(allies[0].maxHp,allies[0].hp+(w.heal||20)); addParticle(colX(allies[0].col),rowY(allies[0].row)-35,'+heal','#d8f9ff'); } p.last=w.rate||1.5; } continue; }
   if(w.role==='bubblebomb'){
     p.last+=dt;
     if(p.last>=(w.rate||.62)){
       const rad=w.stunRadius||120;
       for(const e of game.enemies.slice()){ const ey=rowY(e.row); if(Math.hypot(e.x-px,ey-py)<rad) damageEnemy(e,w.dmg||0,'stun',px,py); }
       for(let a=0;a<Math.PI*2;a+=Math.PI/6){ addParticle(px+Math.cos(a)*10,py-12+Math.sin(a)*5,'○','#b7f3ff',Math.cos(a)*135,Math.sin(a)*105-10); }
       drawSplat(px,py-15,'#80eaff',1.25,.5); addParticle(px,py-42,'BUBBLE BURST!','#d8fbff'); game.plants=game.plants.filter(pl=>pl!==p); game.shake=.12; sfx('sfx_sweeper.mp3',.55);
     }
     continue;
   }
   if(w.role==='fume'){
     p.last-=dt; const targets=game.enemies.filter(e=>e.row===p.row && e.x>px+10 && e.x<px+(w.range||260));
     if(targets.length && p.last<=0){ targets.forEach(e=>damageEnemy(e,w.dmg||16,w.effect||null,px,py)); for(let i=0;i<5;i++) addParticle(px+55+i*35,py-24+rnd(-8,8),'~','#8b4a2f',30+rnd(0,40),-8+rnd(-16,4)); p.last=w.rate||1.1; sfx('sfx_shoot.mp3',.32); }
     continue;
   }
   if(w.role==='trap' || w.role==='bomb'){
     const e=game.enemies.find(e=>e.row===p.row && Math.abs(e.x-px)<35);
     if(e){ damageEnemy(e,w.dmg||120,w.effect,px,py); if(w.role==='bomb'){ splash(px,py,w.dmg||200,95); } game.plants=game.plants.filter(pl=>pl!==p); addParticle(px,py,w.role==='bomb'?'NOVA!':'CHOMP!','#fff27a'); game.shake=.16; }
     continue;
   }
   if(w.role==='spike'){
     p.last-=dt; if(p.last<=0){ const e=game.enemies.find(e=>e.row===p.row && Math.abs(e.x-px)<38); if(e){ damageEnemy(e,w.dmg,w.effect,px,py); p.last=w.rate; } }
     continue;
   }
   if(w.regen && p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+w.regen*dt);
   if(w.role==='wall' && comboActive('milk_wall') && p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+9*dt);
   if(w.role==='bufffood') continue;
   if(w.role==='wall') continue;
   p.last-=dt;

function damageEnemy(e, dmg, effect, x, y){
 if(e.dead) return; const d=enemyDefs[e.type] || enemyDefs.geek; const camp=campaignDefs[game.campaign] || campaignDefs[0];
 if(camp.id==='space' && effect===null) dmg*=1.08;

 if(camp.id==='banana_bloom' && effect==='slip') dmg*=1.18;
 if(camp.id==='bakery' && (effect==='slow'||effect==='slow2')) dmg*=1.05;
 if(camp.id==='sushi' && effect==='burn') dmg*=1.12;
 if(camp.id==='bbq' && effect==='burn') dmg*=1.18;
 if(camp.id==='aquarium' && (effect==='slow'||effect==='slow2')) dmg*=1.08;
 if(d.behavior==='shield'){ e.shieldHits=(e.shieldHits==null?(d.shieldHits||3):e.shieldHits); if(e.shieldHits>0){ e.shieldHits--; dmg*=.35; addParticle(e.x,rowY(e.row)-58,'tray block','#e8f2ff'); } }
 if(d.behavior==='robot' && (effect==='slow'||effect==='slow2'||effect==='freeze')){ effect=null; dmg*=.9; }
 if(d.behavior==='fireproof' && effect==='burn'){ effect=null; dmg*=.85; }
 if(d.behavior==='armor') dmg*=.72;
 if(d.behavior==='freezeResist' && effect==='freeze'){ effect='slow'; dmg*=.9; }
 if(d.behavior==='sugarRush' && !e.rushed){ e.rushed=true; e.speed*=1.32; addParticle(e.x,rowY(e.row)-44,'sugar rush!','#ff94ed'); }
 e.hp-=dmg;
 const sticky=comboActive('gum_licorice')?1.45:1, cold=comboActive('soda_ice')?1.35:1; if(effect==='slow') e.slow=Math.max(e.slow,((camp.id==='candy'||camp.id==='bakery')?4.6:3.4)*sticky); if(effect==='slow2') e.slow=Math.max(e.slow,((camp.id==='candy'||camp.id==='aquarium')?6.6:5.0)*sticky); if(effect==='stun') e.stun=Math.max(e.stun,(camp.id==='mall'?.8:.55)*cold); if(effect==='freeze') e.freeze=Math.max(e.freeze,(camp.id==='freezer'?2.25:1.7)*cold); if(effect==='knock'){ e.x+=camp.id==='jungle'||camp.id==='beach'||camp.id==='pirate'||camp.id==='airport'?42:30; e.stun=Math.max(e.stun,.25); } if(effect==='slip'){ e.stun=Math.max(e.stun,camp.id==='banana_bloom'?3.0:2.2); e.slow=Math.max(e.slow,(camp.id==='banana_bloom'?5.2:4)*sticky); } if(effect==='bleed') e.bleed=Math.max(e.bleed,4); if(effect==='burn') e.burn=Math.max(e.burn,(camp.id==='sushi'||camp.id==='bbq'||camp.id==='volcano'||camp.id==='campfire'||camp.id==='bomb_bonanza')?4.0:3.2); const freshChance=comboActive('apple_carrot') ? .34 : ((camp.id==='market'||camp.id==='picnic') ? .24 : .16); if(effect==='freshMoney' && Math.random()<freshChance) dropMoney(x,y,50);
 if(e.hp<=0){ e.dead=true; if(d.behavior==='split' && !e.splitDone){ e.splitDone=true; for(const off of [-1,1]){ const nr=clamp(e.row+off,0,grid.rows-1); game.enemies.push({type:'geek',row:nr,x:e.x+off*12,y:rowY(nr)+10,hp:46,maxHp:46,speed:46,atk:13,cool:0,stun:0,slow:0,freeze:0,jumped:false,bleed:0,burn:0,boost:0,frame:Math.random()*10}); } addParticle(e.x,rowY(e.row)-55,'split!','#fff27a'); }

}

function stableJitter(x,y,w,h,i,amp){
 const n=Math.sin(x*12.9898 + y*78.233 + w*37.719 + h*11.137 + i*91.17)*43758.5453;
 return ((n-Math.floor(n))*2-1)*amp;
}
function ffJitterPathRect(x,y,w,h,r=10,amp=3){
 // Deterministic sketch wobble. The older version called Math.random() every
 // frame, so panel edges and their dark shadows shimmered/flickered constantly.
 const j=i=>stableJitter(x,y,w,h,i,amp);
 ctx.beginPath();
 ctx.moveTo(x+r,y+j(0));
 ctx.lineTo(x+w-r+j(1),y+j(2));
 ctx.quadraticCurveTo(x+w+j(3),y+j(4),x+w+j(5),y+r+j(6));
 ctx.lineTo(x+w+j(7),y+h-r+j(8));
 ctx.quadraticCurveTo(x+w+j(9),y+h+j(10),x+w-r+j(11),y+h+j(12));
 ctx.lineTo(x+r+j(13),y+h+j(14));
 ctx.quadraticCurveTo(x+j(15),y+h+j(16),x+j(17),y+h-r+j(18));
 ctx.lineTo(x+j(19),y+r+j(20));
 ctx.quadraticCurveTo(x+j(21),y+j(22),x+r+j(23),y+j(24));
 ctx.closePath();
}
function ffBrushBlob(x,y,w,h,fill,alpha=.14){
 ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=fill; ffJitterPathRect(x,y,w,h,22,5); ctx.fill(); ctx.restore();
}

function loop(now){ const dt=(now-last)/1000; last=now; ctx.clearRect(0,0,W,H); update(dt);
 if(state==='loading') loading(); else if(state==='menu') menu(); else if(state==='campaigns') campaigns(); else if(state==='minigames') minigames(); else if(state==='levels') levels(); else if(state==='weapons') weaponSelect(); else if(state==='fooddex') fooddex(); else if(state==='enemydex') enemydex(); else if(state==='upgrades') upgrades(); else if(state==='synergies') synergies(); else if(state==='help') help(); else if(state==='options') options(); else if(state==='play') drawGame();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
